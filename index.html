<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Welcome back, du Arsch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,500&family=Archivo+Black&family=DM+Mono&display=swap">
<style>
  /* Layout: ein einziger zentrierter Bildschirm, schwarze Bühne, Rahmen mit Eckornamenten, Emojis treiben im Hintergrund */
  :root {
    --bg: #070707;
    --ink: #f2f2f0;
    --muted: #8a8a88;
    --line: #2a2a2a;
    --accent: #c4223a;
    --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --font-script: "Bodoni Moda", "Didot", "Times New Roman", serif;
    --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    overflow-x: hidden;
    font-family: var(--font-mono);
  }
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(196,34,58,0.16), transparent 70%);
  }
  .float { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .float span {
    position: absolute; bottom: -10%;
    font-size: var(--s, 1.6rem);
    opacity: 0;
    animation: rise var(--d, 14s) linear var(--delay, 0s) infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .55; }
    90% { opacity: .55; }
    100% { transform: translateY(-115vh) rotate(var(--r, 25deg)); opacity: 0; }
  }
  main {
    position: relative;
    min-height: 100%;
    display: grid;
    place-items: center;
  }
  .frame {
    position: relative;
    width: min(100%, 640px);
    box-sizing: border-box;
    padding: clamp(36px, 9vw, 72px) clamp(20px, 6vw, 56px);
    border: 1px solid var(--line);
    text-align: center;
    background: rgba(7,7,7,0.72);
  }
  .corner {
    position: absolute; width: 22px; height: 22px;
    border: 2px solid var(--accent);
  }
  .tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .eyebrow {
    margin: 0 0 20px;
    font-size: .72rem; letter-spacing: .32em; text-transform: uppercase;
    color: var(--muted);
  }
  h1 { margin: 0; display: grid; gap: 4px; text-wrap: balance; }
  .script {
    font-family: var(--font-script); font-style: italic; font-weight: 500;
    font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: 1.05;
    color: var(--ink);
  }
  .rough {
    font-family: var(--font-display);
    font-size: clamp(2.8rem, 14vw, 5.6rem); line-height: 1;
    text-transform: uppercase; letter-spacing: -.01em;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--accent);
  }
  .rule {
    display: flex; align-items: center; gap: 14px; justify-content: center;
    margin: 30px 0 22px; color: var(--accent); font-size: 1rem;
  }
  .rule::before, .rule::after { content: ""; height: 1px; width: 56px; background: var(--line); }
  .row { font-size: clamp(1.5rem, 6vw, 2rem); letter-spacing: .3em; margin: 0; }
  .note { margin: 22px 0 0; font-size: .85rem; color: var(--muted); line-height: 1.6; }
  button {
    margin-top: 28px;
    font: inherit; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink); background: transparent;
    border: 1px solid var(--ink); padding: 14px 22px; cursor: pointer;
    transition: background .2s, color .2s;
  }
  button:hover { background: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .burst { position: fixed; pointer-events: none; font-size: 1.6rem; z-index: 5; animation: pop 1.1s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(0,0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1.3); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .float span { animation: none; opacity: .35; bottom: auto; top: var(--top, 20%); }
    .burst { animation-duration: .01s; }
  }
</style>

<div class="glow" aria-hidden="true"></div>
<div class="float" id="float" aria-hidden="true"></div>

<main>
  <div class="frame">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <p class="eyebrow">Er ist wieder da</p>
    <h1>
      <span class="script">Welcome back,</span>
      <span class="rough">du Arsch</span>
    </h1>
    <div class="rule" aria-hidden="true">✦</div>
    <p class="row" aria-hidden="true">🖤 😈 🔥 🖤</p>
    <p class="note">Schön, dass du wieder da bist. Ich hab dich vermisst. Ein bisschen.</p>
    <button type="button" id="hit">Klick mich 🖤</button>
  </div>
</main>

<script>
  var emojis = ["🖤", "✨", "🥀", "😈", "🔥", "🦇", "⭐", "🖤"];
  var box = document.getElementById("float");
  for (var i = 0; i < 18; i++) {
    var s = document.createElement("span");
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random() * 96) + "%";
    s.style.setProperty("--s", (1.1 + Math.random() * 1.6).toFixed(2) + "rem");
    s.style.setProperty("--d", (11 + Math.random() * 10).toFixed(1) + "s");
    s.style.setProperty("--delay", (-Math.random() * 18).toFixed(1) + "s");
    s.style.setProperty("--r", (Math.random() * 80 - 40).toFixed(0) + "deg");
    s.style.setProperty("--top", (5 + Math.random() * 85).toFixed(0) + "%");
    box.appendChild(s);
  }
  var btn = document.getElementById("hit");
  btn.addEventListener("click", function (e) {
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var k = 0; k < 14; k++) {
      var b = document.createElement("span");
      b.className = "burst";
      b.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = cx + "px";
      b.style.top = cy + "px";
      var a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
      b.style.setProperty("--x", Math.cos(a) * d + "px");
      b.style.setProperty("--y", Math.sin(a) * d + "px");
      document.body.appendChild(b);
      setTimeout(function (n) { return function () { n.remove(); }; }(b), 1200);
    }
  });
</script>

</body></html>
