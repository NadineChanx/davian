<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Welcome Back</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one left-aligned greeting block on a pale blush ground, black type and accents, black hearts drifting around it. Single committed look. */
:root {
  --bg: #f5e8ed;
  --fg: #15111a;
  --muted: #5f5166;
  --accent: #15111a;
  --accent-ink: #f5e8ed;
  --glow: #c9b3c4;
  --line: #15111a;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Caveat", "Bradley Hand", cursive;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}

.stage {
  position: relative;
  max-width: 880px;
  margin: 0 auto;
  padding-block: clamp(48px, 12vw, 120px);
  isolation: isolate;
}
.stage::before {
  content: "";
  position: absolute;
  inset: -20% -30%;
  z-index: -2;
  background:
    radial-gradient(40% 35% at 78% 22%, color-mix(in srgb, var(--glow) 70%, transparent), transparent 70%),
    radial-gradient(45% 40% at 12% 82%, color-mix(in srgb, var(--glow) 55%, transparent), transparent 70%);
}

.float {
  position: absolute;
  z-index: -1;
  font-size: var(--s, 2rem);
  line-height: 1;
  animation: drift var(--d, 7s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
  user-select: none;
}
@keyframes drift {
  0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
  50% { transform: translateY(-14px) rotate(calc(var(--r, 0deg) + 6deg)); }
}

.kicker {
  font-family: var(--font-hand);
  font-size: 1.7rem;
  color: var(--accent);
  margin: 0 0 4px;
  transform: rotate(-2deg);
  transform-origin: left;
}
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(4rem, 17vw, 10.5rem);
  line-height: 0.88;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
h1 em {
  display: block;
  font-style: italic;
  color: var(--accent);
  padding-left: clamp(0px, 7vw, 90px);
}
.lead {
  max-width: 34ch;
  margin: clamp(28px, 5vw, 48px) 0 0;
  font-size: clamp(1.1rem, 2.6vw, 1.3rem);
  color: var(--fg);
}
.sub {
  max-width: 44ch;
  margin: 12px 0 0;
  color: var(--muted);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 24px;
  margin-top: clamp(32px, 6vw, 56px);
}
.heart-btn {
  font: inherit;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 26px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
  transition: transform 0.15s ease;
}
.heart-btn:hover { transform: translateY(-2px) scale(1.02); }
.heart-btn:active { transform: scale(0.97); }
.heart-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.heart-btn .h { font-size: 1.2em; }
.hint { color: var(--muted); font-size: 0.95rem; }

.strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: clamp(40px, 8vw, 72px);
  padding-top: 20px;
  border-top: 2px solid var(--line);
  font-size: 1.6rem;
  letter-spacing: 0.3em;
}
.burst {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  font-size: 1.6rem;
  line-height: 1;
}

@media (prefers-reduced-motion: reduce) {
  .float { animation: none; }
  .heart-btn { transition: none; }
}
</style>

<main class="stage">
  <span class="float" style="--s:2.6rem; --d:7s; --r:-8deg; top:6%; right:4%;" aria-hidden="true">🖤</span>
  <span class="float" style="--s:1.8rem; --d:9s; --delay:-2s; --r:10deg; top:22%; right:30%;" aria-hidden="true">✨</span>
  <span class="float" style="--s:2.2rem; --d:8s; --delay:-4s; --r:-12deg; top:48%; right:6%;" aria-hidden="true">🖤</span>
  <span class="float" style="--s:1.6rem; --d:6s; --delay:-1s; --r:6deg; bottom:26%; right:24%;" aria-hidden="true">🌑</span>
  <span class="float" style="--s:2rem; --d:10s; --delay:-5s; --r:-6deg; bottom:8%; left:3%;" aria-hidden="true">🖤</span>
  <span class="float" style="--s:1.5rem; --d:7.5s; --delay:-3s; --r:14deg; top:3%; left:46%;" aria-hidden="true">🥀</span>

  <p class="kicker">für dich, mit Liebe gebaut</p>
  <h1>Welcome <em>back!</em></h1>

  <p class="lead">Schön, dass du wieder da bist. Hier ist es einfach ein bisschen heller, wenn du da bist. 🖤</p>
  <p class="sub">Diese Seite gibt es nur für dich. Ich habe sie selbst gebaut, damit du direkt beim Ankommen lächelst.</p>

  <div class="row">
    <button class="heart-btn" id="burst-btn" type="button"><span class="h" aria-hidden="true">🖤</span> Komm her</button>
    <span class="hint">Tipp mal drauf.</span>
  </div>

  <div class="strip" aria-hidden="true">🖤 🌙 ☕ 🕯️ 🥀 🖤</div>
</main>

<script>
(function () {
  var btn = document.getElementById("burst-btn");
  var pool = ["🖤", "🖤", "🖤", "✨", "🌑", "🥀", "💫", "🖤"];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  btn.addEventListener("click", function () {
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var count = reduce ? 6 : 24;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.className = "burst";
      s.textContent = pool[Math.floor(Math.random() * pool.length)];
      s.style.left = cx + "px";
      s.style.top = cy + "px";
      document.body.appendChild(s);
      var angle = Math.random() * Math.PI * 2;
      var dist = 90 + Math.random() * 170;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 60;
      if (s.animate) {
        var a = s.animate(
          [
            { transform: "translate(-50%, -50%) scale(0.4)", opacity: 1 },
            { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(1.3) rotate(" + (Math.random() * 60 - 30) + "deg)", opacity: 0 }
          ],
          { duration: reduce ? 500 : 1100 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)" }
        );
        a.onfinish = (function (el) { return function () { el.remove(); }; })(s);
      } else {
        setTimeout((function (el) { return function () { el.remove(); }; })(s), 800);
      }
    }
  });
})();
</script>

</body></html>
